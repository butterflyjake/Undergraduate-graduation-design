server:
  port: 8080

spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: aed-server
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aed_system?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  quartz:
    job-store-type: memory

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 签名密钥(HS256 要求至少 32 字节), 正式部署请更换
  secret: ${JWT_SECRET}
  # 令牌有效期(小时)
  expire-hours: 24

# 上传文件保存目录(相对后端运行目录)
upload:
  path: ./uploads/

springdoc:
  api-docs:
    enabled: true
